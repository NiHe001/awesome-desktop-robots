name: Check links

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
  pull_request:
    paths:
      - 'README*.md'
      - 'CONTRIBUTING.md'
      - 'assets/robots/**'
      - '.github/workflows/link-check.yml'
  push:
    paths:
      - 'README*.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/link-check.yml'

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Report links requiring review
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose --no-progress --timeout 30 --max-retries 2
            --max-concurrency 4 --exclude-mail
            README.md README.zh-CN.md CONTRIBUTING.md
          fail: false
          failIfEmpty: true
          jobSummary: true
          output: /tmp/lychee-report.md
